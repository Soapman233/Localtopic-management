name: 功能建议
description: 提出一个改进或新功能建议
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先确认它**符合本项目定位**：
        这是一套**面向中学教师的私有题库工具**，只做「搜题 → 组卷 → 导出公式可编辑的成品卷」。

        > 本项目**不做**：多人在线协同、在线答题 / 阅卷、学情分析平台。
        > 也请**不要**在建议里附带真实试卷或私有数据。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你现在遇到什么麻烦？这个建议能解决什么？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它**怎么用**？（界面/流程/行为）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 你现在是怎么绕过这个问题的？可留空。
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 找题 / 检索
        - 组卷 / 排版
        - 导出（公式可编辑）
        - 知识点 / 公式复核
        - 来源文件 / 题库统计
        - 设置 / 外观
        - 安装 / 启动 / 部署
        - 其它
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认该建议**不涉及**多人协同 / 在线答题 / 阅卷。
          required: true
        - label: 建议内容**不含**真实试卷、题库导出或身份信息。
          required: true
