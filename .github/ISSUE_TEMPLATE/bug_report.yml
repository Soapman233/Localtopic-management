name: Bug 报告
description: 报告一个可复现的缺陷（⚠️ 提交前请先脱敏，不要附真实试卷）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先读 [SECURITY.md](https://github.com/Soapman233/Localtopic-management/blob/main/SECURITY.md)。

        > ⚠️ **本项目是私有数据工具。** 请**不要**上传真实试卷 DOCX、题库导出（`bank.db`/JSON/CSV）、
        > 令牌口令、或任何身份信息。请用**脱敏后的最小样例**复现问题。

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 一句话说清楚出了什么问题。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 给出**最小、确定**的步骤，让别人能稳定复现。
      placeholder: |
        1. 打开「找题」页
        2. 输入关键词 …
        3. 点击 …
        4. 观察到 …
    validations:
      required: true

  - type: textarea
    id: actual-vs-expected
    attributes:
      label: 实际结果 vs 预期结果
      description: 分别写「实际发生了什么」与「你期望发生什么」。
      placeholder: |
        实际：…
        预期：…
    validations:
      required: true

  - type: textarea
    id: minimal-sample
    attributes:
      label: 脱敏后的最小样例
      description: |
        用**自造的、几行字的**内容复现同一个问题。
        **不要**附真实试卷 / 题库导出 / 截图原文；路径里的用户名请写成 `<user>`。
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: "Windows 11 Pro 23H2"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 版本
      description: "`python --version` 的输出"
      placeholder: "Python 3.13.14"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js 版本
      description: "`node -v` 的输出"
      placeholder: "v22.22.2"
    validations:
      required: true

  - type: dropdown
    id: office
    attributes:
      label: 本机 Office（影响「公式可编辑」导出链路）
      options:
        - Microsoft Word
        - WPS
        - 两者都有
        - 都没有（仅跑不依赖 Office 的功能）
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: 版本 / 提交号
      description: "`git rev-parse --short HEAD` 的输出"
      placeholder: "e012792"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 报错信息 / 日志（**已脱敏**）
      description: 可留空。请确认其中**不含**真实数据、路径用户名与令牌。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已**脱敏**，未附带真实试卷 / 题库导出 / 令牌 / 身份信息。
          required: true
        - label: 我已确认这是**可复现**的问题（不是一次性的环境抖动）。
          required: true
