# ===========================================================================
#  线上部署版 · nginx 反向代理配置（Windows 版 nginx 同样适用）
#  作用：① 反向代理到本机 8720；② 用 Basic Auth 保护整个站点（含前端页面）
#  用法：把本文件放到 nginx 的 conf.d/ 下，按注释改 server_name / 证书路径
# ===========================================================================

# 生成口令文件（首次）：
#   Windows: 用 httpasswd 工具或在线 bcrypt 生成
#   Linux:   htpasswd -c /etc/nginx/.htpasswd teacher
# 口令文件路径见下方 auth_basic_user_file

server {
    listen       80;
    server_name  _;              # 改为你的内网 IP 或域名

    # 大文件上传/导出留足余量
    client_max_body_size 64m;

    # ---- 访问控制：Basic Auth（保护整个站点，含前端页面与 API）----
    auth_basic           "题库（请向管理员索取账号）";
    auth_basic_user_file /etc/nginx/.htpasswd;   # ← 改成你的口令文件路径

    # ---- 反向代理到题库服务 ----
    location / {
        proxy_pass         http://127.0.0.1:8720;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 导出/像素预览是长任务，放宽超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 健康检查放行（容器探针 / 负载均衡用）
    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8720/api/health;
    }

    # ---- （可选）HTTPS：内网若无需加密可整段删除 ----
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/server.crt;
    # ssl_certificate_key /etc/nginx/certs/server.key;
}
